<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
<header class="hero">
<p class="eyebrow">Agenda</p>
<h1>Optredens</h1>
<p class="muted">Beheer de agenda met optredens.</p>
</header>
<div id="auth-view" class="panel">
  <h2>Beheer</h2>
  <p class="muted">Log in om optredens te beheren.</p>
  <button id="google-login" class="primary-button" type="button">Inloggen met Google</button>
  <p><a class="secondary-button" href="changelog.html">Changelog</a></p>
  <p id="auth-error" class="error" hidden></p>
</div>
<section id="admin-view" hidden>
  <div class="toolbar">
    <button id="new-event" class="primary-button" type="button">+ Nieuw optreden</button>
    <div class="toolbar-actions"><button id="logout" class="secondary-button" type="button">Uitloggen</button><a class="secondary-button" href="changelog.html">Changelog</a></div>
  </div>
  <form id="event-form" class="panel" hidden>
    <div class="form-heading"><h2 id="form-title">Nieuw optreden</h2><button id="cancel-event" class="icon-button" type="button" aria-label="Annuleren">×</button></div>
    <div class="form-grid">
      <label>Datum<input id="event-date" type="date" required></label>
      <label>Tijd<input id="event-time" type="time" required></label>
      <label class="full">Naam evenement<input id="event-name" type="text" placeholder="Bijv. Zomerfeest" required></label>
      <label class="full">Locatie<input id="event-location" type="text" placeholder="Bijv. Café De Zon, Hengelo" required></label>
      <label class="full">URL (optioneel)<input id="event-url" type="url" placeholder="https://..."></label>
      <label class="full">Beschrijving<textarea id="event-description" rows="7" placeholder="Lange beschrijving van het optreden..."></textarea></label>
      <label class="full">Afbeelding<input id="event-image" type="file" accept="image/*"><span id="image-current" class="field-hint"></span></label>
      <div class="form-actions full"><button id="save-event" class="primary-button" type="submit">Opslaan</button><button id="cancel-event-2" class="secondary-button" type="button">Annuleren</button></div>
    </div>
  </form>
  <section>
    <div class="section-heading"><h2>Optredens</h2><span id="event-count" class="count"></span></div>
    <label class="filter-checkbox"><input id="future-only" type="checkbox"> Alleen toekomstige optredens</label>
    <div id="event-list" class="event-list"></div>
  </section>
  <p id="app-error" class="error" hidden></p>
</section>
</main>
<footer class="version">v1.4</footer>
<script type="module" src="app.js?v=6"></script>
</body>
</html>
